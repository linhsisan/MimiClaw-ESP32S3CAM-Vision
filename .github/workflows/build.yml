name: Build

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  idf-build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'  # 👈 建議加上這行：確保完整拉取所有依賴的子模組

      # 👇 插入這個全新步驟：修復 Docker 容器內的 Git 目錄權限問題 👇
      - name: Fix Git directory permission
        run: git config --global --add safe.directory '*'

      - name: Build firmware (ESP32-S3)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py fullclean
          idf.py build